name: Lean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Check for sorry
        run: "! grep -rn 'sorry' Movement.lean Movement/"
      - name: Analyzer regression check
        run: |
          python3 -m pip install --quiet numpy scipy
          python3 analyzer/analyze.py --check
